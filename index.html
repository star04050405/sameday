<footer>
 sameday. 同一天 —— 三年五年十年，同一页纸上写下不同年份的你。<br>

 灵感来自流行的多年问答日记本（Q&amp;A a day）：每年同一天问同一个问题。
</footer>

 document.getElementById('dnow').textContent=KEY.replace('-',' . ')+'  '+['SUN','MON','TUE','WED','THU','FRI','SAT'][NOW.getDay()]+'  '+YNOW;
 document.getElementById('qnow').textContent=qof(KEY);
 var v=(log[KEY]||{})[YNOW];
 document.getElementById('ans').value=v||'';
}
function renderStamp(){
 var n=0;YEARS.forEach(function(y){if((log[KEY]||{})[y])n++});
 var st=document.getElementById('stamp');
 st.innerHTML='<b>Y'+(n+1)+'</b><span>YEAR</span>';
}
function saveToday(){
 var t=document.getElementById('ans').value.trim();
 if(!t){toast('先写点什么吧');return}
 if(!log[KEY])log[KEY]={};
 log[KEY][YNOW]=t;localStorage.setItem(LS_LOG,JSON.stringify(log));
 toast(YNOW+' 年的今天，写好了');
 renderYears();renderGrid();renderStat();renderStamp();
}
function renderYears(){
 var el=document.getElementById('ylist');var h='';
 YEARS.forEach(function(y){
  var v=(log[KEY]||{})[y];
  h+='<div class="yn"><div class="yb'+(y===YNOW?' now':'')+'">'+String(y).slice(2)+'</div><div class="yt"><div class="ym">'+y+(y===YNOW?' · 今年':'')+'</div><div class="yv'+(v?'':' empty')+'">'+(v?esc(v):(y===YNOW?'今年的答案，等你写在上面 ↑':'那一年，还没有答案'))+'</div></div></div>';
 });
 if(!YEARS.length)h='';
 el.innerHTML=h;
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function renderStat(){
 var total=0;Object.keys(log).forEach(function(k){total+=Object.keys(log[k]).length});
 var ydone=Object.keys(log).filter(function(k){return (log[k]||{})[YNOW]}).length;
 document.getElementById('stat').innerHTML=
  '今年已答 <b>'+ydone+'</b> / 366　累计 <b>'+total+'</b> 条　第 <b>1</b> / '+book+' 年';
}
function renderGrid(){
 var w=document.getElementById('gwrap');var h='';
 for(var m=1;m<=12;m++){
  var days=(m===2?29:[31,28,31,30,31,30,31,31,30,31,30,31][m]);
  h+='<div class="mlabel">MONTH '+pad(m)+'</div><div class="gwall">';
  for(var d=1;d<=days;d++){
   var k=pad(m)+'-'+pad(d);
   var done=(log[k]&&Object.keys(log[k]).length)?' done':'';
   var now=(k===KEY)?' now':'';
   var leap=(k==='02-29'?' leap':'');
   h+='<div class="g'+done+now+leap+'" data-k="'+k+'" onclick="openSheet(\''+k+'\')"></div>';
  }
  h+='</div>';
 }
 w.innerHTML=h;
}
/* sheet */
var SK='';
function openSheet(k){
 SK=k;
 document.getElementById('sdate').textContent=k.replace('-',' . ');
 document.getElementById('sq').textContent=qof(k);
 var yh='';
 YEARS.slice().reverse().forEach(function(y){
  var v=(log[k]||{})[y];
  yh+='<div class="yn"><div class="yb'+(y===YNOW?' now':'')+'">'+String(y).slice(2)+'</div><div class="yt"><div class="ym">'+y+'</div><div class="yv'+(v?'':' empty')+'">'+(v?esc(v):'—')+'</div></div></div>';
 });
 document.getElementById('syears').innerHTML=yh;
 var sel=document.getElementById('sely');sel.innerHTML='';
 YEARS.forEach(function(y){var o=document.createElement('option');o.value=y;o.textContent=y+' 年';sel.appendChild(o)});
 sel.value=YNOW;
 document.getElementById('sans').value=(log[k]||{})[YNOW]||'';
 document.getElementById('sheet').classList.add('open');
}
function closeSheet(){document.getElementById('sheet').classList.remove('open')}
function saveSheet(){
 var y=document.getElementById('sely').value;
 var t=document.getElementById('sans').value.trim();
 if(!t){toast('先写点什么吧');return}
 if(!log[SK])log[SK]={};
 log[SK][y]=t;localStorage.setItem(LS_LOG,JSON.stringify(log));
 toast(SK+' · '+y+' 年，写好了');
 openSheet(SK);renderGrid();renderStat();renderYears();renderStamp();
}
/* 工具 */
function dl(name,content,type){
 var a=document.createElement('a');
 a.href=URL.createObjectURL(new Blob([content],{type:type||'text/plain;charset=utf-8'}));
 a.download=name;a.click();
}
function exportTxt(){
 var ks=Object.keys(log).sort();var h='sameday. 同一天 —— 全部日记\n\n';
 ks.forEach(function(k){h+=k+'　'+qof(k)+'\n';Object.keys(log[k]).sort().forEach(function(y){h+='  '+y+'：'+log[k][y]+'\n'});h+='\n'});
 if(!ks.length){toast('本子还是空的');return}
 dl('sameday-diary.txt',h);
}
function exportJson(){
 if(!Object.keys(log).length){toast('本子还是空的');return}
 dl('sameday-backup.json',JSON.stringify(log,null,1),'application/json');
}
var ctimer;
function askClear(){
 var b=document.getElementById('cbtn');b.classList.add('show');
 clearTimeout(ctimer);ctimer=setTimeout(function(){b.classList.remove('show')},4000);
}
function doClear(){
 localStorage.removeItem(LS_LOG);log={};
 renderToday();renderYears();renderGrid();renderStat();renderStamp();
 document.getElementById('cbtn').classList.remove('show');
 toast('本子已清空');
}
var ttimer;
function toast(s){
 var t=document.getElementById('toast');t.textContent=s;t.classList.add('show');
 clearTimeout(ttimer);ttimer=setTimeout(function(){t.classList.remove('show')},2200);
}
renderBooks();renderToday();renderYears();renderGrid();renderStat();renderStamp();
